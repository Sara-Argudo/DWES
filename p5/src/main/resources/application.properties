# Base de datos MariaDB de Docker Compose (puerto 3307; ver README)
spring.datasource.url=jdbc:mariadb://localhost:3307/shop
spring.datasource.username=shop
spring.datasource.password=shop

# Flyway: la estructura y la semilla de la base de datos se gestionan con
# migraciones en resources/db/migration (se ejecutan al arrancar la app)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
