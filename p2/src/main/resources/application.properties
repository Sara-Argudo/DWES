spring.datasource.url=jdbc:mariadb://localhost:3307/shop
spring.datasource.username=shop
spring.datasource.password=shop

# El esquema lo crea la semilla del contenedor (db/init.sql); Hibernate no toca el DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Semilla del ADMIN (solo para entornos de desarrollo; reemplaza por variables de entorno reales)
shop.admin.name=${SHOP_ADMIN_NAME:admin}
shop.admin.email=${SHOP_ADMIN_EMAIL:admin@shop.local}
shop.admin.password=${SHOP_ADMIN_PASSWORD:admin-pass-123}

# Firma de los JWT (en desarrollo; usa JWT_SECRET por variable de entorno en producción)
shop.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-please-0123456789}
shop.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:30}
shop.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
